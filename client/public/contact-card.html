<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Henry-Santiago | GigitekAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 200px;
            height: auto;
        }

        .qr-code {
            margin: 30px 0;
        }

        .qr-code img {
            max-width: 250px;
            height: auto;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            margin: 30px 0 10px;
        }

        .website {
            font-size: 28px;
            margin: 20px 0;
        }

        .website a {
            color: #1967d2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .website a:hover {
            color: #1557b0;
            text-decoration: underline;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .contact-item {
            font-size: 22px;
            color: #000;
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
        }

        .contact-item:hover {
            color: #1967d2;
        }

        .phone {
            color: #1967d2;
        }

        .email a {
            color: #000;
        }

        .email a:hover {
            color: #1967d2;
        }

        .scan-text {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .name {
                font-size: 24px;
            }

            .website {
                font-size: 20px;
            }

            .contact-item {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <img src="https://cdn.gigitekai.com/gigitekai-logo.webp" alt="GigitekAI" style="max-width: 200px;">
        </div>

        <!-- QR Code -->
        <div class="qr-code">
            <img src="https://cdn.gigitekai.com/qr-contact-with-text.png" alt="QR Code" style="max-width: 250px;">
            <p class="scan-text">Scan to save contact</p>
        </div>

        <!-- Name -->
        <div class="name">Harry Henry-Santiago</div>

        <!-- Website -->
        <div class="website">
            <a href="https://www.gigitekai.com" target="_blank">https://www.gigitekai.com</a>
        </div>

        <!-- Contact Info -->
        <div class="contact-info">
            <a href="tel:+17273825776" class="contact-item phone">
                📞 (727) 382-6909
            </a>
            <a href="mailto:harry@gigitekai.com" class="contact-item email">
                ✉️ harry@gigitekai.com
            </a>
        </div>
    </div>
</body>
</html>

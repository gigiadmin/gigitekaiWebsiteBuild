<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Henry-Santiago | GigitekAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .logo {
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 180px;
            height: auto;
        }
        .qr-code {
            margin: 30px 0;
        }
        .qr-code img {
            max-width: 280px;
            height: auto;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
        }
        .name {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            margin: 30px 0 10px;
        }
        .website {
            font-size: 24px;
            margin: 20px 0;
        }
        .website a {
            color: #1967d2;
            text-decoration: none;
            font-weight: 600;
        }
        .website a:hover {
            text-decoration: underline;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .contact-item {
            font-size: 20px;
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
        }
        .contact-item:hover {
            color: #1967d2;
        }
        .phone {
            color: #1967d2;
        }
        .email {
            color: #000;
        }
        .email:hover {
            color: #1967d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://cdn.gigitekai.com/gigitekai-logo.webp" alt="GigitekAI">
        </div>
        <div class="qr-code">
            <img src="https://cdn.gigitekai.com/qr-contact-with-text.png" alt="QR Code">
        </div>
        <div class="name">Harry Henry-Santiago</div>
        <div class="website">
            <a href="https://www.gigitekai.com" target="_blank">https://www.gigitekai.com</a>
        </div>
        <div class="contact-info">
            <a href="tel:+17273825776" class="contact-item phone">📞 (727) 382-5776</a>
            <a href="mailto:harry@gigitekai.com" class="contact-item email">✉️ harry@gigitekai.com</a>
        </div>
    </div>
</body>
</html>

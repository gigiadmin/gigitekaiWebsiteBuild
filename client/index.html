    <!-- reCAPTCHA v3 Script: Deferred to load only when contact forms are visible -->
    <!-- This prevents render-blocking and reduces FCP by ~200ms on homepage -->
    <script>
      // Lazy-load reCAPTCHA only when a form element becomes visible
      const loadRecaptcha = () => {
        if (document.querySelector('form [name="g-recaptcha-response"], .g-recaptcha')) {
          const script = document.createElement('script');
          script.src = 'https://www.google.com/recaptcha/api.js';
          script.async = true;
          script.defer = true;
          document.head.appendChild(script);
          observer.disconnect();
        }
      };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.target.tagName === 'FORM') {
            loadRecaptcha();
          }
        });
      });
      // Observe all forms on the page
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('form').forEach(form => observer.observe(form));
      });
    </script>

    <!-- Google Analytics 4: loaded after page interactive to reduce INP -->
    <script>
      // Defer GA4 initialization until after page is interactive
      // This improves INP (Interaction to Next Paint) by keeping main thread free
      function loadGA4() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-00F4D2QCEX';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-00F4D2QCEX', {
          'page_path': window.location.pathname,
          'page_title': document.title
        });
      }
      // Defer GTM to requestIdleCallback (after page interactive) for better performance
      // This prevents GTM from blocking main thread during critical rendering
      var gaLoaded = false;
      function triggerGA() {
        if (gaLoaded) return;
        gaLoaded = true;
        loadGA4();
      }
      // Load GA only after browser is idle (after LCP + TTI)
      // requestIdleCallback fires when the main thread has no critical work
      // This prevents GA from contributing to TBT (Total Blocking Time)
      if (typeof requestIdleCallback !== 'undefined') {
        window.addEventListener('load', function() {
          requestIdleCallback(triggerGA, { timeout: 5000 });
        });
      } else {
        // Safari fallback: 4s delay after load event
        window.addEventListener('load', function() {
          setTimeout(triggerGA, 4000);
        });
      }
    </script>

    <!-- Google Analytics 4: loaded after page interactive to reduce INP -->
    <script>
      // Defer GA4 initialization until after page is interactive
      // This improves INP (Interaction to Next Paint) by keeping main thread free
      function loadGA4() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-00F4D2QCEX';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-00F4D2QCEX', {
          'page_path': window.location.pathname,
          'page_title': document.title
        });
      }
      // Load after user interaction or 3 seconds, whichever comes first
      var gaLoaded = false;
      function triggerGA() {
        if (gaLoaded) return;
        gaLoaded = true;
        loadGA4();
      }
      if (document.readyState === 'complete') {
        setTimeout(triggerGA, 1000);
      } else {
        window.addEventListener('load', function() { setTimeout(triggerGA, 1000); });
      }
      ['click','scroll','keydown','touchstart'].forEach(function(e) {
        document.addEventListener(e, triggerGA, { once: true, passive: true });
      });
    </script>

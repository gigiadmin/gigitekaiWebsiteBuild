name: PowerShell Script Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'scripts/**/*.ps1'
      - '.github/workflows/powershell-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'scripts/**/*.ps1'

jobs:
  lint:
    runs-on: windows-latest
    name: Lint PowerShell Scripts
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse
          $results = @()
          
          foreach ($script in $scripts) {
            $analysis = Invoke-ScriptAnalyzer -Path $script.FullName -Severity Warning
            if ($analysis) {
              $results += $analysis
              Write-Host "⚠️ Issues found in $($script.Name):"
              $analysis | ForEach-Object { Write-Host "  - $($_.Message)" }
            } else {
              Write-Host "✅ $($script.Name) passed"
            }
          }
          
          if ($results.Count -gt 0) {
            Write-Host "`n❌ Found $($results.Count) issues"
            exit 1
          } else {
            Write-Host "`n✅ All scripts passed linting"
          }

  syntax-check:
    runs-on: windows-latest
    name: Check PowerShell Syntax
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PowerShell Syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse
          $errors = @()
          
          foreach ($script in $scripts) {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $script.FullName), [ref]$null)
              Write-Host "✅ $($script.Name) syntax OK"
            } catch {
              $errors += $_
              Write-Host "❌ Syntax error in $($script.Name): $_"
            }
          }
          
          if ($errors.Count -gt 0) {
            Write-Host "`n❌ Found $($errors.Count) syntax errors"
            exit 1
          } else {
            Write-Host "`n✅ All scripts have valid syntax"
          }

  module-test:
    runs-on: windows-latest
    name: Test PowerShell Module
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser

      - name: Run Pester Tests
        shell: pwsh
        run: |
          if (Test-Path ./scripts/tests) {
            $results = Invoke-Pester -Path ./scripts/tests -PassThru
            if ($results.FailedCount -gt 0) {
              Write-Host "❌ $($results.FailedCount) tests failed"
              exit 1
            } else {
              Write-Host "✅ All tests passed"
            }
          } else {
            Write-Host "⚠️ No test directory found at ./scripts/tests"
          }

  security-scan:
    runs-on: windows-latest
    name: Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run Security Analysis
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse
          $securityIssues = @()
          
          foreach ($script in $scripts) {
            $analysis = Invoke-ScriptAnalyzer -Path $script.FullName -IncludeRule PSAvoidUsingPlainTextForPassword, PSAvoidUsingConvertToSecureStringWithPlainText, PSAvoidUsingInvokeExpression
            if ($analysis) {
              $securityIssues += $analysis
              Write-Host "🔒 Security issues in $($script.Name):"
              $analysis | ForEach-Object { Write-Host "  - $($_.Message)" }
            }
          }
          
          if ($securityIssues.Count -gt 0) {
            Write-Host "`n⚠️ Found $($securityIssues.Count) potential security issues"
            exit 1
          } else {
            Write-Host "`n✅ No security issues found"
          }

  documentation-check:
    runs-on: windows-latest
    name: Check Script Documentation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Script Documentation
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse
          $missingDocs = @()
          
          foreach ($script in $scripts) {
            $content = Get-Content $script.FullName -Raw
            
            # Check for required documentation elements
            $hasDescription = $content -match '<#[\s\S]*?\.DESCRIPTION[\s\S]*?#>'
            $hasExample = $content -match '<#[\s\S]*?\.EXAMPLE[\s\S]*?#>'
            $hasAuthor = $content -match '<#[\s\S]*?\.AUTHOR[\s\S]*?#>'
            
            if (-not ($hasDescription -and $hasExample -and $hasAuthor)) {
              $missingDocs += $script.Name
              Write-Host "📝 Missing documentation in $($script.Name)"
            } else {
              Write-Host "✅ $($script.Name) has complete documentation"
            }
          }
          
          if ($missingDocs.Count -gt 0) {
            Write-Host "`n⚠️ $($missingDocs.Count) scripts missing required documentation"
            exit 1
          } else {
            Write-Host "`n✅ All scripts have required documentation"
          }

  build-module:
    runs-on: windows-latest
    name: Build PowerShell Module
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Module
        shell: pwsh
        run: |
          if (Test-Path ./scripts/GigitekAI.Scripts.psd1) {
            try {
              $manifest = Import-PowerShellDataFile ./scripts/GigitekAI.Scripts.psd1
              Write-Host "✅ Module manifest is valid"
              Write-Host "Module Name: $($manifest.ModuleName)"
              Write-Host "Version: $($manifest.ModuleVersion)"
            } catch {
              Write-Host "❌ Invalid module manifest: $_"
              exit 1
            }
          } else {
            Write-Host "⚠️ Module manifest not found"
          }

  report:
    runs-on: windows-latest
    name: Generate Report
    needs: [lint, syntax-check, module-test, security-scan, documentation-check, build-module]
    if: always()
    
    steps:
      - name: Check Results
        shell: pwsh
        run: |
          $results = @{
            lint = "${{ needs.lint.result }}"
            syntax = "${{ needs.syntax-check.result }}"
            tests = "${{ needs.module-test.result }}"
            security = "${{ needs.security-scan.result }}"
            docs = "${{ needs.documentation-check.result }}"
            build = "${{ needs.build-module.result }}"
          }
          
          Write-Host "CI/CD Pipeline Results:"
          Write-Host "========================"
          $results.GetEnumerator() | ForEach-Object {
            $status = if ($_.Value -eq "success") { "✅" } else { "❌" }
            Write-Host "$status $($_.Key): $($_.Value)"
          }
          
          $failed = $results.Values | Where-Object { $_ -ne "success" } | Measure-Object | Select-Object -ExpandProperty Count
          if ($failed -gt 0) {
            Write-Host "`n❌ Pipeline failed with $failed failures"
            exit 1
          } else {
            Write-Host "`n✅ All checks passed!"
          }

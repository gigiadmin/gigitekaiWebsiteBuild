name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gigiadmin/gigitekai
  RESOURCE_GROUP: rg-gigitekai-staging
  ACA_ENV: acaenv-gigitekai-staging
  WEB_APP: ca-gigitekai-web-staging
  WORKER_APP: ca-gigitekai-worker-staging

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy web container
        run: |
          az containerapp update \
            --name ${{ env.WEB_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --output none

      - name: Deploy worker container
        run: |
          az containerapp update \
            --name ${{ env.WORKER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --output none

      - name: Wait for revision
        run: |
          az containerapp show --name ${{ env.WEB_APP }} --resource-group ${{ env.RESOURCE_GROUP }} --query "properties.latestRevisionName"
          sleep 30

      - name: Smoke test staging
        env:
          STAGING_URL: https://${{ env.WEB_APP }}.${{ secrets.AZURE_LOCATION }}.azurecontainerapps.io
        run: |
          curl -fsS "$STAGING_URL/healthz" | jq .
          curl -fsS "$STAGING_URL/readyz" | jq .
          echo "Staging deployment complete: $STAGING_URL"

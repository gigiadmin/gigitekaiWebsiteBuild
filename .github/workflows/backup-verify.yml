name: Backup Verification

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify MySQL backup exists
        run: |
          az mysql flexible-server backup list \
            --resource-group rg-gigitekai-production \
            --name mysql-gigitekai-production \
            --query "max_by([], &properties.completedTime)" | jq .

      - name: Verify Blob container exists
        run: |
          # Internal Azure Storage container naming (lowercase, no dashes): gigitekaiproduction<unique>
          # In GitHub, set UNIQUE_SUFFIX as a repository variable for the backup-verify workflow.
          az storage container exists \
            --account-name stggigitekaiproduction${{ vars.UNIQUE_SUFFIX }} \
            --name app-files \
            --auth-mode login | jq .

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"text":"Backup verification failed for GigitekAI production."}' \
            ${{ secrets.TEAMS_ALERT_WEBHOOK_URL }}

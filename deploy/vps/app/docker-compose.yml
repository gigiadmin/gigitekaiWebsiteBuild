# Phase 2: full application on the VPS behind Caddy.
#   cp deploy/vps/app/.env.example /opt/gigitekai/.env   # fill in ROTATED secrets
#   docker compose -f deploy/vps/app/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ../../..
      dockerfile: deploy/vps/app/Dockerfile
    container_name: gigitekai-app
    restart: unless-stopped
    env_file: /opt/gigitekai/.env
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
